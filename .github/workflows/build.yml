name: Build and check WPF
on:
  push:
    branches: [wpf]
  pull_request:
    branches: [wpf]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Moonlit-Waters.sln --locked-mode
      - run: dotnet build Moonlit-Waters.sln --configuration Release --no-restore
      - run: dotnet run --project .github/smoke/WindowSmoke.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpf-window-screenshots
          path: wpf-screenshots/*.png
